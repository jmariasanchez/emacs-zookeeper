name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p zk-bridge --target ${{ matrix.target }}
      - name: Package
        run: |
          set -eu
          name="zk-bridge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zk-bridge" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emacs package tarball
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/zookeeper-$v"
          cp lisp/*.el "dist/zookeeper-$v/"
          cat > "dist/zookeeper-$v/zookeeper-pkg.el" <<EOF
          (define-package "zookeeper" "$v" "ZooKeeper browser and toolkit"
            '((emacs "29.1") (transient "0.4"))
            :url "https://github.com/${GITHUB_REPOSITORY}")
          EOF
          tar -C dist -cf "dist/zookeeper-$v.tar" "zookeeper-$v"
      - uses: actions/upload-artifact@v4
        with:
          name: emacs-package
          path: dist/*.tar

  publish:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
