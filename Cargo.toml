[workspace]
resolver = "2"
members = [
    "crates/zk-core",
    "crates/zk-cache",
    "crates/zk-recipes",
    "crates/zk-bridge",
    "crates/zk-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josesanchez/emacs-zookeeper"
authors = ["emacs-zookeeper contributors"]

[workspace.dependencies]
zookeeper-client = { version = "0.11.2", features = ["tokio", "tls", "sasl-digest-md5"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "process", "signal"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
rand = "0.8"

zk-core = { path = "crates/zk-core" }
zk-cache = { path = "crates/zk-cache" }
zk-recipes = { path = "crates/zk-recipes" }
zk-testkit = { path = "crates/zk-testkit" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
