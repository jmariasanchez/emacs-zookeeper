[package]
name = "zk-bridge"
description = "JSON-RPC 2.0 stdio bridge exposing zk-core, zk-cache and zk-recipes to editors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zk-bridge"
path = "src/main.rs"

[features]
default = []
gssapi = ["zk-core/gssapi"]

[dependencies]
zk-core.workspace = true
zk-cache.workspace = true
zk-recipes.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true

[dev-dependencies]
zk-testkit.workspace = true

[[bench]]
name = "ipc"
harness = false
